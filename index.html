    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuse — Connect Incomplete Ideas with the Right People</title>
    
    <!-- Instant Synchronous Dark Mode & Brand Accent Detection -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('fuse_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var accent = localStorage.getItem('fuse_accent') || 'orange';
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark, html.dark body {
        background-color: #111110 !important;
        color: #F5F5F0 !important;
        color-scheme: dark;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
